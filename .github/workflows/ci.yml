name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The NixOS VM test boots a VM: make /dev/kvm usable on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v30
      # Builds the package (which runs the tests) and the NixOS VM test.
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs

  nix-aarch64:
    # The package on aarch64-linux, built natively on GitHub's arm runner.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - run: nix build .#packages.aarch64-linux.unigif-bot --print-build-logs
